# Weather refresh (production AND staging) + production price-freshness watchdog. This job does NOT fetch prices:
# data.gov.in refuses GitHub addresses; the Supabase Edge Function mandi-refresh (Mumbai) is the only price writer.
# production: weather, then RED only if the newest stored Sagar-division price is older than 3 days or missing. staging: weather only.
#
# IMPORTANT: GitHub runs `schedule` triggers only from the DEFAULT branch (main), and a scheduled run checks out
# main. So main must contain BOTH this file AND the scripts it calls (scripts/refresh-data.mjs, scripts/lib/*).
# A release branch that has newer scripts does nothing for the schedule until it is merged into main.
#
# Each target is checked against its expected Supabase project ref before anything is written, so a staging secret in
# the production slot (or the reverse) fails at once. Empty secrets fail with a plain message; they are never skipped.
name: Refresh Mandi Prices

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours at minute 17 UTC (off the busy top-of-hour slot, which GitHub often drops); keeps weather current
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-mandi-prices
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: production
            expected_ref: eltmcznjcqiahqhjvpjg
            url_secret_name: PROD_SUPABASE_URL
            key_secret_name: PROD_SUPABASE_SERVICE_ROLE_KEY
          - target: staging
            expected_ref: wzxtqbqlahyahsnoqqva
            url_secret_name: VITE_SUPABASE_URL
            key_secret_name: SUPABASE_SERVICE_ROLE_KEY
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # supabase-js needs native WebSocket (Node 22+)

      - run: npm ci

      - name: Refresh weather and check price freshness (${{ matrix.target }})
        env:
          # Secrets are chosen by target; the script reads VITE_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY.
          VITE_SUPABASE_URL: ${{ matrix.target == 'production' && secrets.PROD_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ matrix.target == 'production' && secrets.PROD_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          URL_SECRET_NAME: ${{ matrix.url_secret_name }}
          KEY_SECRET_NAME: ${{ matrix.key_secret_name }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then echo "::error::GitHub secret $URL_SECRET_NAME is empty or missing (target: ${{ matrix.target }}). Add it under Settings > Secrets and variables > Actions."; exit 1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::GitHub secret $KEY_SECRET_NAME is empty or missing (target: ${{ matrix.target }}). Add it under Settings > Secrets and variables > Actions."; exit 1; fi
          node scripts/refresh-data.mjs --target ${{ matrix.target }} --expect-project-ref ${{ matrix.expected_ref }}
