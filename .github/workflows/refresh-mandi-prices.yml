name: Refresh Mandi Prices

on:
  schedule:
    - cron: '0 */3 * * *'   # Every 3 hours UTC (covers 2:30 PM IST and other key times); keeps weather current
  workflow_dispatch:         # Keep manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # supabase-js needs native WebSocket (Node 22+)

      - run: npm ci

      - name: Refresh mandi prices and weather
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        # Run node directly (no --env-file): CI injects env vars via the env: block
        # above, and there is no .env file in the runner. The local `npm run
        # refresh-prices` keeps using --env-file=.env for local runs.
        run: node scripts/refresh-data.mjs
