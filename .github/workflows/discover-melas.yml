name: Discover Kisan Melas

on:
  schedule:
    - cron: '30 1 * * *'    # Once per day, 01:30 UTC (07:00 IST) — Mela announcements don't change hourly
  workflow_dispatch:          # Manual trigger

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # supabase-js needs native WebSocket (Node 22+)

      - run: npm ci

      - name: Fail fast if the production Anthropic key is missing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set. The Kisan Mela discovery pipeline cannot run."
            echo "::error::Owner action: obtain a production Anthropic API key and add it as the ANTHROPIC_API_KEY repository secret."
            exit 1
          fi

      - name: Discover upcoming Kisan Melas (AI-assisted, India-scoped, source-verified)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # CI injects env vars via the env: block above; no .env file in the runner.
        run: node scripts/discover-melas.mjs
