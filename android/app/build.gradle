apply plugin: 'com.android.application'

// Batch 8B — two app flavours from one project, chosen per build without editing files:
//   ./gradlew assembleDebug                      production: com.kissansahyog.app, "Kisan Sahyog"
//   ./gradlew assembleDebug -PksFlavor=staging   staging: com.kissansahyog.app.staging,
//                                                "Kisan Sahyog (Staging)" — installs next to production
//   -PksCleartext=true                           ONLY for the local-API test build (http://localhost)
// scripts/build-android.mjs passes these; the web assets must be built for the same target.
def ksFlavor = (project.findProperty('ksFlavor') ?: 'production').toString()
if (!['production', 'staging'].contains(ksFlavor)) throw new GradleException("ksFlavor must be production or staging, not " + ksFlavor)
def ksStaging = ksFlavor == 'staging'
def ksCleartext = (project.findProperty('ksCleartext') ?: 'false').toString() == 'true'

// Batch 9 Phase 3 — release signing. The upload key and its passwords live OUTSIDE the repo
// (C:\Users\usdvi\ks-release-keys\, see docs/store/KEYSTORE_README.md). android/keystore.properties
// (gitignored) points at it with storeFile, storePassword, keyAlias, keyPassword. If the file is
// absent (any other machine, CI) the release build still succeeds, just UNSIGNED.
def ksKeystorePropsFile = rootProject.file('keystore.properties')
def ksKeystoreProps = new Properties()
def ksHasReleaseKey = false
if (ksKeystorePropsFile.exists()) {
    ksKeystorePropsFile.withInputStream { ksKeystoreProps.load(it) }
    ksHasReleaseKey = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { ksKeystoreProps.getProperty(it) }
    if (!ksHasReleaseKey) logger.warn('keystore.properties is incomplete — release build will be UNSIGNED')
}

android {
    namespace = "com.kissansahyog.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId ksStaging ? "com.kissansahyog.app.staging" : "com.kissansahyog.app"
        manifestPlaceholders = [appLabel: ksStaging ? "Kisan Sahyog (Staging)" : "Kisan Sahyog", usesCleartext: ksCleartext ? "true" : "false"]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (ksHasReleaseKey) {
            release {
                storeFile file(ksKeystoreProps.getProperty('storeFile'))
                storePassword ksKeystoreProps.getProperty('storePassword')
                keyAlias ksKeystoreProps.getProperty('keyAlias')
                keyPassword ksKeystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (ksHasReleaseKey) signingConfig signingConfigs.release
            // debuggable stays false (the release default). WebView remote debugging follows it:
            // Capacitor enables it only when FLAG_DEBUGGABLE is set and capacitor.config has no override.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
