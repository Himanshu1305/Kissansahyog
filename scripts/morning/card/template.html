<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>morning card</title>
<style>
/*FONTS*/
:root { --bg:#FBFAF5; --soft:#F1F6E9; --green:#24733F; --green-dark:#185A31; --tint:#EAF3DE; --ink:#173323; --ink2:#3F4A38; --orange:#B4520A; --saffron:#E69A2D; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; background: var(--bg); color: var(--ink); font-family: 'KSDev', 'Noto Sans Devanagari', sans-serif; font-size: 36px; line-height: 1.3; overflow: hidden; }
#card { width: 1080px; height: 1350px; display: flex; flex-direction: column; }
.box { min-width: 0; overflow-wrap: anywhere; }
.top { background: var(--green); color: #fff; padding: 40px 56px 34px; }
.brand { font-size: 68px; font-weight: 700; line-height: 1.5; }
.date { font-size: 40px; margin-top: 8px; }
.tithi { font-size: 38px; margin-top: 4px; color: #fff; }
.body { flex: 1; padding: 36px 56px 0; display: flex; flex-direction: column; gap: 32px; min-height: 0; }
.panel { border-radius: 28px; padding: 30px 36px; }
.weather { background: var(--tint); border: 3px solid var(--green); }
.title { font-size: 40px; font-weight: 700; color: var(--green-dark); margin-bottom: 14px; }
.w-row { display: flex; align-items: baseline; gap: 28px; flex-wrap: wrap; }
.w-temp { font-size: 76px; font-weight: 700; color: var(--ink); }
.w-sky { font-size: 44px; font-weight: 700; color: var(--ink2); }
.w-line { font-size: 38px; color: var(--ink2); margin-top: 6px; }
.prices { background: #fff; border: 3px solid var(--soft); padding-bottom: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 16px 0; border-bottom: 2px solid var(--soft); }
.row:last-child { border-bottom: 0; }
.crop { font-size: 50px; font-weight: 700; flex: 1 1 0; min-width: 0; }
.price { font-size: 56px; font-weight: 700; text-align: right; white-space: nowrap; }
.chg { font-size: 40px; font-weight: 700; width: 220px; text-align: right; white-space: nowrap; }
.up { color: var(--green-dark); } .down { color: var(--orange); } .flat { color: var(--ink2); }
.note { font-size: 36px; color: var(--ink2); margin-top: 10px; }
.empty { font-size: 42px; color: var(--ink2); padding: 20px 0; }
.foot { background: var(--green-dark); color: #fff; padding: 28px 56px; font-size: 38px; text-align: center; margin-top: 32px; }
</style>
</head>
<body>
<div id="card">
  <div class="top">
    <div class="brand box" id="brand"></div>
    <div class="date box" id="date"></div>
    <div class="tithi box" id="tithi"></div>
  </div>
  <div class="body" id="body"></div>
  <div class="foot box" id="foot"></div>
</div>
<script>
const D = /*DATA*/null;
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
document.getElementById('brand').textContent = D.brand;
document.getElementById('date').textContent = D.dateText;
if (D.tithiText) document.getElementById('tithi').textContent = D.tithiText; else document.getElementById('tithi').remove();
document.getElementById('foot').textContent = D.footer;
const body = document.getElementById('body');
if (D.weather) {
  const p = el('div', 'panel weather box');
  p.appendChild(el('div', 'title box', D.weather.title));
  const r = el('div', 'w-row');
  r.appendChild(el('div', 'w-temp box', D.weather.temps));
  r.appendChild(el('div', 'w-sky box', D.weather.sky));
  p.appendChild(r);
  p.appendChild(el('div', 'w-line box', D.weather.rain));
  body.appendChild(p);
}
if (D.prices && D.prices.length) {
  const p = el('div', 'panel prices box');
  p.appendChild(el('div', 'title box', D.priceTitle));
  for (const x of D.prices) {
    const r = el('div', 'row');
    r.appendChild(el('div', 'crop box', x.name));
    r.appendChild(el('div', 'price box', x.price));
    r.appendChild(el('div', 'chg box ' + x.dir, x.change));
    p.appendChild(r);
  }
  if (D.priceNote) p.appendChild(el('div', 'note box', D.priceNote));
  body.appendChild(p);
} else if (!D.weather) {
  body.appendChild(el('div', 'empty box', D.noData));
}
// Fit: long crop names step the name size down (never below 36px) and then tighten the rows, so nothing is cut off.
(function fit() {
  const b = document.getElementById('body');
  const crops = [...document.querySelectorAll('.crop')];
  const rows = [...document.querySelectorAll('.row')];
  for (let size = 50; size >= 36 && b.scrollHeight > b.clientHeight + 1; size -= 2) crops.forEach((c) => { c.style.fontSize = size + 'px'; });
  for (let pad = 16; pad >= 6 && b.scrollHeight > b.clientHeight + 1; pad -= 2) rows.forEach((r) => { r.style.paddingTop = pad + 'px'; r.style.paddingBottom = pad + 'px'; });
})();
</script>
</body>
</html>
